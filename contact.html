<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Me | Primeframe</title>

  <!-- CSS -->
  <link rel="stylesheet" href="contact.css">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">

  <div class="logo">
    PRIME<span>FRAME</span>
  </div>

  <nav class="nav">
    <a href="/index.html">Home</a>
    <a href="/aboutus.html">About</a>
    <a href="/projects.html">Projects</a>
    <a href="/contact.html" class="active">Contact</a>
  </nav>

</header>


<!-- HERO -->
<section class="contact-hero">

  <h1>Contact Me</h1>
  <p>Let’s work together 🚀</p>

</section>


<!-- CONTACT -->
<section class="contact-section">

  <div class="contact-container">

    <!-- INFO -->
    <div class="contact-info">

      <h2>Get In Touch</h2>

      <p>
        Have a project or idea?  
        Send me a message and I’ll reply soon.
      </p>

      <div class="info-box">
        <i class="fas fa-envelope"></i>
        <span>primeframe.creative@gmail.com</span>
      </div>

      <div class="info-box">
        <i class="fas fa-map-marker-alt"></i>
        <span>India</span>
      </div>

      <div class="contact-social">
        
        <a href=""><i class="fab fa-linkedin"></i></a>
        <a href="https://www.instagram.com/priimeframe.studio?igsh=OHVqcW1lbzZzcHpj"><i class="fab fa-instagram"></i></a>
      </div>

    </div>


    <!-- FORM (CONNECTED TO FORMSPREE) -->
    <form 
      class="contact-form"
      action="https://formspree.io/f/xnjvowgz"
      method="POST"
    >

      <h2>Send Message</h2>

      <input 
        type="text" 
        name="name" 
        placeholder="Your Name" 
        required
      >

      <input 
        type="email" 
        name="email" 
        placeholder="Your Email" 
        required
      >

      <textarea 
        name="message"
        rows="5"
        placeholder="Your Message"
        required
      ></textarea>

      <!-- Redirect after submit -->
      <input type="hidden" name="_next" value="thankyou.html">

      <button type="submit">Send Message</button>

    </form>

  </div>

</section>


<!-- FOOTER -->
<footer class="footer">

  <p>© 2026 Primeframe | All Rights Reserved</p>

</footer>

</body>
</html>
